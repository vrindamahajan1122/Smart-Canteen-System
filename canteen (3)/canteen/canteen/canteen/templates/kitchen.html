<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitchen Dashboard - Smart Campus Canteen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .token-cell { font-size: 1.4rem; font-weight: 800; }
    .live-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #198754; margin-right: 6px; animation: pulse 1.5s infinite; }
    .live-dot.offline { background: #dc3545; animation: none; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: .3; } 100% { opacity: 1; } }
    .menu-toggle { border: 1px solid #dee2e6; border-radius: 10px; padding: 10px 14px; background: #fff; }
    .menu-toggle.soldout { background: #f1f3f5; border-color: #ced4da; }
    .menu-toggle.soldout .item-name { text-decoration: line-through; color: #868e96; }
    .menu-toggle .form-check-input { width: 2.6em; height: 1.4em; cursor: pointer; }
    @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">👨‍🍳 Kitchen Dashboard</span>
    <div>
      <a class="btn btn-sm btn-outline-light me-1" href="/">Student View</a>
      <a class="btn btn-sm btn-outline-light me-1" href="/display">Display Board</a>
      <a class="btn btn-sm btn-outline-light me-1" href="/analytics">Analytics</a>
      <a class="btn btn-sm btn-outline-light" href="/qr">Menu QR</a>
    </div>
  </div>
</nav>

<main class="container-fluid py-4">

  <!-- Sold-out toggles -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
      <strong>Menu availability</strong>
      <small class="text-muted">Switch an item off when it runs out. Students can't order it.</small>
    </div>
    <div class="card-body">
      <div class="row g-2" id="menuToggles">
        <div class="col-12 text-muted">Loading menu...</div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0">Active Orders <span class="badge bg-secondary" id="orderCount">0</span></h1>
    <small class="text-muted"><span class="live-dot" id="liveDot"></span><span id="liveText">Live - updates every 3 seconds</span></small>
  </div>

  <div id="errorBanner" class="alert alert-danger d-none"></div>

  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>Token #</th>
            <th>Student Name</th>
            <th>Items Ordered</th>
            <th>Pickup Slot</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr><td colspan="6" class="text-center text-muted py-4">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script>
(function () {
  "use strict";

  var POLL_MS = 3000;
  var MENU_POLL_MS = 5000;
  var tbody = document.getElementById("ordersBody");
  var countBadge = document.getElementById("orderCount");
  var errorBanner = document.getElementById("errorBanner");
  var liveDot = document.getElementById("liveDot");
  var liveText = document.getElementById("liveText");
  var menuBox = document.getElementById("menuToggles");

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // ---------------- Orders ----------------
  function statusBadge(status) {
    var cls = "bg-secondary";
    if (status === "Pending") cls = "bg-warning text-dark";
    else if (status === "Preparing") cls = "bg-info text-dark";
    else if (status === "Ready") cls = "bg-success";
    return '<span class="badge ' + cls + '">' + escapeHtml(status) + "</span>";
  }

  function actionButtons(order) {
    var id = order.order_id;
    var s = order.status;
    return '<div class="btn-group btn-group-sm" role="group">' +
      '<button class="btn btn-outline-info" data-id="' + id + '" data-status="Preparing"' + (s === "Preparing" ? " disabled" : "") + '>Mark Preparing</button>' +
      '<button class="btn btn-outline-success" data-id="' + id + '" data-status="Ready"' + (s === "Ready" ? " disabled" : "") + '>Mark Ready</button>' +
      '<button class="btn btn-outline-dark" data-id="' + id + '" data-status="Completed">Mark Completed</button>' +
      "</div>";
  }

  function render(orders) {
    countBadge.textContent = orders.length;
    if (orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No active orders right now.</td></tr>';
      return;
    }
    var html = "";
    orders.forEach(function (o) {
      html += "<tr>" +
        '<td class="token-cell">#' + o.order_id + "</td>" +
        "<td>" + escapeHtml(o.student_name) + "</td>" +
        "<td>" + escapeHtml(o.items_summary) + "</td>" +
        "<td>" + escapeHtml(o.pickup_time) + "</td>" +
        "<td>" + statusBadge(o.status) + "</td>" +
        '<td class="text-end">' + actionButtons(o) + "</td>" +
        "</tr>";
    });
    tbody.innerHTML = html;
  }

  function setOnline(online, msg) {
    if (online) {
      liveDot.classList.remove("offline");
      liveText.textContent = "Live - updates every 3 seconds";
      errorBanner.classList.add("d-none");
    } else {
      liveDot.classList.add("offline");
      liveText.textContent = "Connection problem - retrying...";
      errorBanner.textContent = msg || "Could not load orders.";
      errorBanner.classList.remove("d-none");
    }
  }

  function loadOrders() {
    return fetch("/api/orders", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.success) { setOnline(false, data.error); return; }
        setOnline(true);
        render(data.orders);
      })
      .catch(function () { setOnline(false, "Network error while loading orders."); });
  }

  // Event delegation for the status buttons
  tbody.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-status]");
    if (!btn) return;
    btn.disabled = true;

    fetch("/api/update_status", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        order_id: parseInt(btn.getAttribute("data-id"), 10),
        status: btn.getAttribute("data-status")
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.success) { alert(data.error || "Could not update the order."); }
      return loadOrders();
    })
    .catch(function () {
      alert("Network error. Status was not updated.");
      return loadOrders();
    });
  });

  // ---------------- Menu availability ----------------
  var lastMenuKey = "";

  function renderMenu(items) {
    if (!items.length) {
      menuBox.innerHTML = '<div class="col-12 text-muted">No menu items found.</div>';
      return;
    }
    var html = "";
    items.forEach(function (it) {
      html += '<div class="col-12 col-md-6 col-xl-3">' +
        '<div class="menu-toggle d-flex justify-content-between align-items-center' + (it.is_available ? "" : " soldout") + '">' +
          '<div>' +
            '<div class="fw-semibold item-name">' + escapeHtml(it.item_name) + '</div>' +
            '<small class="text-muted">₹' + it.price.toFixed(2) + '</small>' +
            (it.is_available ? "" : ' <span class="badge bg-danger ms-1">Sold out</span>') +
          '</div>' +
          '<div class="form-check form-switch m-0">' +
            '<input class="form-check-input" type="checkbox" role="switch" data-item="' + it.item_id + '"' +
              ' aria-label="' + escapeHtml(it.item_name) + ' available"' + (it.is_available ? " checked" : "") + '>' +
          '</div>' +
        '</div></div>';
    });
    menuBox.innerHTML = html;
  }

  function loadMenu() {
    return fetch("/api/menu", { cache: "no-store" })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.success) return;
        var key = JSON.stringify(data.items);
        if (key !== lastMenuKey) {     // re-render only when something changed
          lastMenuKey = key;
          renderMenu(data.items);
        }
      })
      .catch(function () { /* the orders poll already shows connection problems */ });
  }

  menuBox.addEventListener("change", function (e) {
    var box = e.target.closest("input[data-item]");
    if (!box) return;
    var wanted = box.checked;
    box.disabled = true;

    fetch("/api/toggle_item", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        item_id: parseInt(box.getAttribute("data-item"), 10),
        is_available: wanted
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (!data.success) { alert(data.error || "Could not update the item."); }
      lastMenuKey = "";              // force a fresh render from the database
      return loadMenu();
    })
    .catch(function () {
      alert("Network error. Item was not updated.");
      lastMenuKey = "";
      return loadMenu();
    });
  });

  loadOrders();
  loadMenu();
  setInterval(loadOrders, POLL_MS);
  setInterval(loadMenu, MENU_POLL_MS);
})();
</script>
</body>
</html>
