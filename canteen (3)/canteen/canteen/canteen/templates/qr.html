<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu QR Code - Smart Campus Canteen</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f9; }
    .poster { max-width: 460px; margin: 0 auto; background: #fff; border-radius: 20px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.12); }
    .poster-head { background: linear-gradient(135deg, #ff7e29, #ff4d4d); color: #fff; padding: 24px 20px; text-align: center; }
    .poster-body { padding: 28px 20px; text-align: center; }
    #qrBox { display: inline-block; padding: 14px; background: #fff; border: 3px solid #212529; border-radius: 14px; }
    #qrBox img, #qrBox canvas { display: block; }
    .url-text { word-break: break-all; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .poster { box-shadow: none; border: 2px solid #212529; }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4 no-print">
  <div class="container">
    <span class="navbar-brand mb-0 h1">🍽️ Menu QR Code</span>
    <div>
      <a class="btn btn-sm btn-outline-light me-1" href="/kitchen">Kitchen</a>
      <a class="btn btn-sm btn-outline-light" href="/analytics">Analytics</a>
    </div>
  </div>
</nav>

<main class="container pb-5">
  <div class="poster mb-4">
    <div class="poster-head">
      <h1 class="h3 mb-1">Scan to see the menu & order</h1>
      <p class="mb-0">Skip the queue. Pick your food and a pickup slot.</p>
    </div>
    <div class="poster-body">
      <div id="qrBox"></div>
      <p class="mt-3 mb-1 fw-semibold">Smart Campus Canteen</p>
      <p class="url-text text-muted mb-0" id="urlText"></p>
    </div>
  </div>

  <div class="card shadow-sm mx-auto no-print" style="max-width: 460px;">
    <div class="card-body">
      <label for="urlInput" class="form-label fw-semibold">Link inside the QR code</label>
      <input type="url" class="form-control mb-2" id="urlInput" value="{{ default_url }}">
      <div class="form-text mb-3">
        Phones must be on the same Wi-Fi as this computer. To let anyone scan from anywhere,
        run <code>ngrok http 5000</code> and paste the https link here.
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-danger" id="makeBtn">Update QR</button>
        <button type="button" class="btn btn-outline-dark" id="downloadBtn">Download PNG</button>
        <button type="button" class="btn btn-outline-dark" id="printBtn">Print poster</button>
      </div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  "use strict";

  var box = document.getElementById("qrBox");
  var input = document.getElementById("urlInput");
  var urlText = document.getElementById("urlText");
  var qr = null;

  function make() {
    var url = input.value.trim();
    if (!url) return;
    urlText.textContent = url;
    if (qr) {
      qr.clear();
      qr.makeCode(url);
    } else {
      qr = new QRCode(box, {
        text: url,
        width: 260,
        height: 260,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.M
      });
    }
  }

  document.getElementById("makeBtn").addEventListener("click", make);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") make(); });

  document.getElementById("downloadBtn").addEventListener("click", function () {
    var canvas = box.querySelector("canvas");
    if (!canvas) return;
    var a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = "canteen-menu-qr.png";
    a.click();
  });

  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });

  make();
})();
</script>
</body>
</html>
